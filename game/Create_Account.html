<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account | Color Game</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{min-height:100vh;background:linear-gradient(135deg,#f5f8ff,#fff,#f7f3ff);color:#152f68}.cardx{max-width:500px;border:1px solid #e1e8f5;border-radius:24px;box-shadow:0 18px 50px rgba(31,58,110,.1)}.brand{font-weight:900;font-size:27px;color:#173a82}.brand span{color:#6338ea}.form-control{border-radius:12px;padding:12px 14px;border-color:#dce5f4}.form-control:focus{box-shadow:0 0 0 .2rem rgba(67,91,235,.1);border-color:#6172ed}.create-btn{border:0;border-radius:12px;padding:12px;background:linear-gradient(90deg,#216dff,#7636ec);font-weight:800}.icon-box{width:70px;height:70px;border-radius:20px;background:linear-gradient(135deg,#e9f1ff,#f0e9ff);display:grid;place-items:center;color:#4d40df;font-size:30px}.back-link{text-decoration:none;color:#46618f;font-size:13px;font-weight:700}.small-note{font-size:11px;color:#8392ab}
</style>
</head>
<body>
<div class="container py-4 py-md-5">
 <div class="mb-4"><a class="back-link" href="index.html"><i class="bi bi-arrow-left me-1"></i> Back to Home</a></div>
 <div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
   <div class="card cardx bg-white">
    <div class="card-body p-4 p-md-5">
     <div class="text-center mb-4"><div class="icon-box mx-auto mb-3"><i class="bi bi-person-plus-fill"></i></div><div class="brand">COLOR <span>GAME</span></div><h1 class="h4 fw-bold mt-3 mb-1">Create Account</h1><p class="text-secondary small mb-0">Create your account to continue</p></div>
     <form id="createForm">
      <label class="form-label fw-semibold small">Full Name</label><input id="name" class="form-control mb-3" required>
      <label class="form-label fw-semibold small">Username</label><input id="username" class="form-control mb-3" required minlength="3">
      <label class="form-label fw-semibold small">Mobile Number</label><input id="mobile" class="form-control mb-3" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required>
      <label class="form-label fw-semibold small">Password</label><input id="password" type="password" class="form-control mb-3" required minlength="4">
      <label class="form-label fw-semibold small">Confirm Password</label><input id="confirm" type="password" class="form-control mb-3" required minlength="4">
      <div class="form-check mb-4"><input class="form-check-input" id="terms" type="checkbox" required><label class="form-check-label small" for="terms">I agree to the account terms.</label></div>
      <button class="btn create-btn text-white w-100" type="submit">CREATE ACCOUNT <i class="bi bi-arrow-right ms-1"></i></button>
     </form>
     <div id="createMsg" class="alert d-none mt-3 small"></div>
     <div class="text-center mt-4"><span class="text-secondary small">Already have an account?</span> <a href="Login.html" class="fw-bold text-decoration-none">Login</a></div>
     <p class="small-note text-center mt-4 mb-0">Virtual practice experience • No real-money wagering</p>
    </div>
   </div>
  </div>
 </div>
</div>
<script>
const key='colorGameUsers';const form=document.getElementById('createForm');const msg=document.getElementById('createMsg');
form.addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),username=document.getElementById('username').value.trim(),mobile=document.getElementById('mobile').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password!==confirm){show('danger','Passwords do not match.');return;}let users=JSON.parse(localStorage.getItem(key)||'[]');if(users.some(x=>x.username===username)){show('danger','Username already exists.');return;}if(users.some(x=>x.mobile===mobile)){show('danger','Mobile number already exists.');return;}users.push({name,username,mobile,password,createdAt:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(users));show('success','Account created successfully. Redirecting to login...');setTimeout(()=>location.href='Login.html',900);});function show(type,text){msg.className='alert alert-'+type+' mt-3 small';msg.textContent=text;}
</script>
</body>
</html>

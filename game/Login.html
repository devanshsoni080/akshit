<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Color Game</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{min-height:100vh;background:linear-gradient(135deg,#f5f8ff,#fff,#f7f3ff);color:#152f68}.login-card{max-width:450px;border:1px solid #e1e8f5;border-radius:24px;box-shadow:0 18px 50px rgba(31,58,110,.1)}.brand{font-weight:900;font-size:27px;color:#173a82}.brand span{color:#6338ea}.form-control{border-radius:12px;padding:12px 14px;border-color:#dce5f4}.form-control:focus{box-shadow:0 0 0 .2rem rgba(67,91,235,.1);border-color:#6172ed}.login-btn{border:0;border-radius:12px;padding:12px;background:linear-gradient(90deg,#216dff,#7636ec);font-weight:800}.icon-box{width:70px;height:70px;border-radius:20px;background:linear-gradient(135deg,#e9f1ff,#f0e9ff);display:grid;place-items:center;color:#4d40df;font-size:30px}.back-link{text-decoration:none;color:#46618f;font-size:13px;font-weight:700}.small-note{font-size:11px;color:#8392ab}
</style>
</head>
<body>
<div class="container py-4 py-md-5">
 <div class="mb-4"><a class="back-link" href="index.html"><i class="bi bi-arrow-left me-1"></i> Back to Home</a></div>
 <div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6 col-xl-5">
   <div class="card login-card bg-white">
    <div class="card-body p-4 p-md-5">
     <div class="text-center mb-4">
      <div class="icon-box mx-auto mb-3"><i class="bi bi-person-lock"></i></div>
      <div class="brand">COLOR <span>GAME</span></div>
      <h1 class="h4 fw-bold mt-3 mb-1">Welcome Back</h1>
      <p class="text-secondary small mb-0">Login to continue to your account</p>
     </div>
     <form id="loginForm">
      <label class="form-label fw-semibold small">Username / Mobile</label>
      <div class="input-group mb-3"><span class="input-group-text bg-white border-end-0"><i class="bi bi-person"></i></span><input id="loginUser" class="form-control border-start-0" required></div>
      <label class="form-label fw-semibold small">Password</label>
      <div class="input-group mb-2"><span class="input-group-text bg-white border-end-0"><i class="bi bi-lock"></i></span><input id="loginPass" type="password" class="form-control border-start-0" required><button class="btn btn-outline-secondary border-start-0" type="button" id="togglePass"><i class="bi bi-eye"></i></button></div>
      <div class="d-flex justify-content-between align-items-center mb-4"><div class="form-check"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label small" for="remember">Remember me</label></div><a href="#" class="small text-decoration-none">Forgot password?</a></div>
      <button class="btn login-btn text-white w-100" type="submit">LOGIN <i class="bi bi-arrow-right ms-1"></i></button>
     </form>
     <div id="loginMsg" class="alert d-none mt-3 small"></div>
     <div class="text-center mt-4"><span class="text-secondary small">Don't have an account?</span> <a href="Create_Account.html" class="fw-bold text-decoration-none">Create Account</a></div>
     <p class="small-note text-center mt-4 mb-0">Virtual practice experience • No real-money wagering</p>
    </div>
   </div>
  </div>
 </div>
</div>
<script>
const usersKey='colorGameUsers';
const form=document.getElementById('loginForm');
const msg=document.getElementById('loginMsg');
document.getElementById('togglePass').onclick=()=>{const p=document.getElementById('loginPass');p.type=p.type==='password'?'text':'password';};
form.addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('loginUser').value.trim();const p=document.getElementById('loginPass').value;let users=JSON.parse(localStorage.getItem(usersKey)||'[]');let user=users.find(x=>x.username===u||x.mobile===u);if(!user&&u==='demo'&&p==='1234') user={username:'demo',mobile:'',name:'Demo User'};if(!user||user.password!==p){msg.className='alert alert-danger mt-3 small';msg.textContent='Invalid username/mobile or password.';return;}localStorage.setItem('colorGameLoggedIn',JSON.stringify({username:user.username,name:user.name||user.username}));window.location.href='index.html';});
</script>
</body>
</html>

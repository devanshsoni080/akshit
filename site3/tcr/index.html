<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Chetak Riders Jaipur</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #090909;
        color: #fff;
        font-family: Arial, sans-serif;
      }
      header {
        text-align: center;
        padding: 28px;
        background: linear-gradient(135deg, #050505, #241805);
        border-bottom: 1px solid #a47821;
      }
      h1 {
        color: #f3c65d;
        letter-spacing: 2px;
        margin: 0 0 7px;
      }
      p {
        color: #ccc;
      }
      main {
        max-width: 1250px;
        margin: auto;
        padding: 30px 18px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 22px;
      }
      .card {
        background: #151515;
        border: 1px solid #76571e;
        border-radius: 16px;
        padding: 14px;
      }
      .card img {
        display: block;
        width: 100%;
        height: 300px;
        object-fit: contain;
        background: #050505;
        border-radius: 12px;
      }
      h2 {
        font-size: 18px;
        color: #f3c65d;
        margin: 14px 3px;
      }
      .btn {
        display: block;
        text-align: center;
        text-decoration: none;
        padding: 13px;
        border-radius: 9px;
        background: #f3c65d;
        color: #111;
        font-weight: 800;
      }
      .btn:hover {
        background: #ffd978;
      }
      .note {
        text-align: center;
      }
      footer {
        text-align: center;
        color: #888;
        padding: 25px;
        border-top: 1px solid #333;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>CHETAK RIDERS JAIPUR</h1>
      <p>Ride Hard • Ride Safe • Ride Together</p>
    </header>
    <main>
      <p class="note">All images are stored in the <b>images</b> folder.</p>
      <div class="grid">
        <div class="card">
          <img src="https://akshit-wheat.vercel.app/site3/tcr/images/jaipur-banswara-route.png" alt="Jaipur → Banswara Route" />
          <h2>Jaipur → Banswara Route</h2>
          <a class="btn" href="https://akshit-wheat.vercel.app/site3/tcr/images/jaipur-banswara-route.png" download="jaipur-banswara-route.png"
            >View Image</a
          >
        </div>

        <div class="card">
          <img src="https://akshit-wheat.vercel.app/site3/tcr/images/jaipur-banswara-round-trip.png" alt="Jaipur → Banswara & Return" />
          <h2>Jaipur → Banswara & Return</h2>
          <a
            class="btn"
            href="https://akshit-wheat.vercel.app/site3/tcr/images/jaipur-banswara-round-trip.png"
            download="jaipur-banswara-round-trip.png"
            >View Image</a
          >
        </div>

        <div class="card">
          <img src="https://akshit-wheat.vercel.app/site3/tcr/images/chetak-riders-website-logo.png" alt="Website Logo" />
          <h2>Website Logo</h2>
          <a
            class="btn"
            href="https://akshit-wheat.vercel.app/site3/tcr/images/chetak-riders-website-logo.png"
            download="chetak-riders-website-logo.png"
            >View Image</a
          >
        </div>

        <div class="card">
          <img src="https://akshit-wheat.vercel.app/site3/tcr/images/chetak-riders-main-batch-logo.png" alt="Main Batch Logo" />
          <h2>Main Batch Logo</h2>
          <a
            class="btn"
            href="https://akshit-wheat.vercel.app/site3/tcr/images/chetak-riders-main-batch-logo.png"
            download="chetak-riders-main-batch-logo.png"
            >View Image</a
          >
        </div>

        <div class="card">
          <img src="https://akshit-wheat.vercel.app/site3/tcr/images/chetak-riders-high-quality-logo.png" alt="High Quality Logo" />
          <h2>High Quality Logo</h2>
          <a
            class="btn"
            href="https://akshit-wheat.vercel.app/site3/tcr/images/chetak-riders-high-quality-logo.png"
            download="chetak-riders-high-quality-logo.png"
            >View Image</a
          >
        </div>
      </div>
    </main>
    <footer>© Chetak Riders Jaipur</footer>
  </body>
</html>
